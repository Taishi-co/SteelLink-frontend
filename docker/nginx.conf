server {
    listen 80;
    server_name localhost;

    # 买家端
    location / {
        root /usr/share/nginx/html/buyer;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 卖家端
    location /seller {
        alias /usr/share/nginx/html/seller;
        index index.html;
        try_files $uri $uri/ /seller/index.html;
    }

    # 物流服务端
    location /logistics {
        alias /usr/share/nginx/html/logistics;
        index index.html;
        try_files $uri $uri/ /logistics/index.html;
    }

    # 仓储服务端
    location /warehouse {
        alias /usr/share/nginx/html/warehouse;
        index index.html;
        try_files $uri $uri/ /warehouse/index.html;
    }

    # 资金服务端
    location /finance {
        alias /usr/share/nginx/html/finance;
        index index.html;
        try_files $uri $uri/ /finance/index.html;
    }

    # API 代理
    location /api {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
